<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="Animated ASCII identity for Niloofar safari">
<defs><linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b5e58"/><stop offset=".56" stop-color="#0c3438"/><stop offset="1" stop-color="#284e88"/></linearGradient><radialGradient id="aura"><stop stop-color="#43ead3" stop-opacity=".22"/><stop offset="1" stop-color="#43ead3" stop-opacity="0"/></radialGradient><clipPath id="type"><rect x="0" y="0" width="0" height="225"><animate attributeName="width" from="0" to="520" dur="2.5s" calcMode="spline" keySplines=".32 .72 0 1" fill="freeze"/></rect></clipPath><style>.display{font:700 28px 'Trebuchet MS',sans-serif;fill:#dcfff7}.title{font:700 24px 'Trebuchet MS',sans-serif;fill:#dcfff7}.label{font:700 9px 'Trebuchet MS',sans-serif;fill:#43ead3;letter-spacing:1.6px}.body{font:12px 'Trebuchet MS',sans-serif;fill:#79aaa4}.mono{font:10px ui-monospace,Consolas,monospace;fill:#79aaa4}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.ascii{font:700 11px ui-monospace,Consolas,monospace;fill:#83ffe8;letter-spacing:.4px}.chip{font:700 8px 'Trebuchet MS',sans-serif;fill:#dcfff7}.phase-a{animation:phaseA 3.4s cubic-bezier(.32,.72,0,1) infinite}.phase-b{animation:phaseB 3.4s cubic-bezier(.32,.72,0,1) infinite}@keyframes phaseA{0%,42%{opacity:1}58%,92%{opacity:0}100%{opacity:1}}@keyframes phaseB{0%,42%{opacity:0}58%,92%{opacity:1}100%{opacity:0}}</style></defs>
<rect width="900" height="380" rx="24" fill="#0b1d20"/><rect x="6" y="6" width="888" height="368" rx="20" fill="url(#shell)" stroke="#168f82"/><rect x="18" y="18" width="864" height="344" rx="17" fill="#071416" stroke="#1a7269"/><circle cx="230" cy="185" r="180" fill="url(#aura)"/>
<circle cx="38" cy="37" r="5" fill="#ff665d"/><circle cx="56" cy="37" r="5" fill="#f5c451"/><circle cx="74" cy="37" r="5" fill="#46d468"/><text x="450" y="41" text-anchor="middle" class="mono">nsafarizanjani@github: ~$ ./wordmark --animate</text>
<rect x="32" y="57" width="286" height="292" rx="22" fill="#081d1f" stroke="#176f68"/><text x="48" y="78" class="label">PORTRAIT.ASCII / @nsafarizanjani</text>
<g id="biomedical-effect" opacity=".72" pointer-events="none">
  <defs>
    <linearGradient id="bioGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#43ead3" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#4387ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#9b6cff" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="bioCore">
      <stop stop-color="#43ead3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#43ead3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bioGrid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#43ead3" stroke-opacity=".12"/>
    </pattern>
  </defs>

  <!-- subtle biomedical HUD background -->
  <rect x="42" y="86" width="266" height="258" rx="16" fill="url(#bioGrid)"/>
  <ellipse cx="176" cy="214" rx="108" ry="104" fill="url(#bioCore)" opacity=".32"/>

  <!-- DNA-inspired digital helix -->
  <g fill="none" stroke="url(#bioGlow)" stroke-width="1.7">
    <path d="M92 104 C150 126 202 146 254 170 C282 183 282 211 254 224 C202 248 150 269 92 292"
          stroke-dasharray="4 4"/>
    <path d="M254 104 C196 126 144 146 92 170 C64 183 64 211 92 224 C144 248 196 269 254 292"
          stroke-dasharray="4 4"/>
  </g>

  <!-- DNA rungs -->
  <g stroke="#83ffe8" stroke-width="1" opacity=".7">
    <path d="M109 113L237 113"/>
    <path d="M128 126L218 126"/>
    <path d="M151 140L195 140"/>
    <path d="M174 154L174 154"/>
    <path d="M195 168L151 168"/>
    <path d="M218 182L128 182"/>
    <path d="M237 196L109 196"/>
    <path d="M218 210L128 210"/>
    <path d="M195 224L151 224"/>
    <path d="M174 238L174 238"/>
    <path d="M151 252L195 252"/>
    <path d="M128 266L218 266"/>
    <path d="M109 280L237 280"/>
  </g>

  <!-- ECG / signal trace -->
  <path d="M48 231 L75 231 L82 226 L88 239 L96 211 L105 250 L115 231
           L139 231 L146 226 L153 239 L161 216 L170 246 L179 231
           L203 231 L211 226 L218 239 L226 214 L235 247 L244 231 L299 231"
        fill="none" stroke="#43ead3" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="8 5">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- diagnostic scan rings -->
  <g fill="none" stroke="#4387ff" opacity=".55">
    <circle cx="176" cy="214" r="34"/>
    <circle cx="176" cy="214" r="48" stroke-dasharray="3 5"/>
    <circle cx="176" cy="214" r="63" stroke-dasharray="1 7"/>
  </g>

  <!-- molecular / neural nodes -->
  <g fill="#83ffe8">
    <circle cx="67" cy="118" r="2.2"/>
    <circle cx="88" cy="151" r="2.2"/>
    <circle cx="282" cy="124" r="2.2"/>
    <circle cx="265" cy="153" r="2.2"/>
    <circle cx="70" cy="286" r="2.2"/>
    <circle cx="286" cy="283" r="2.2"/>
  </g>
  <g stroke="#9b6cff" stroke-width="1" opacity=".6">
    <path d="M67 118L88 151L70 286"/>
    <path d="M282 124L265 153L286 283"/>
    <path d="M88 151L151 140"/>
    <path d="M265 153L218 168"/>
  </g>

  <!-- biomedical HUD labels -->
  <g font-family="ui-monospace,Consolas,monospace" font-size="7" fill="#83ffe8" opacity=".72">
    <text x="49" y="101">BIOMEDICAL // SCAN</text>
    <text x="49" y="331">DNA · ECG · NEURAL · SIGNAL</text>
    <text x="251" y="101">LIVE</text>
  </g>

  <!-- moving scan line -->
  <rect x="48" y="92" width="244" height="1.5" fill="#43ead3" opacity=".65">
    <animate attributeName="y" from="92" to="337" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</g>

